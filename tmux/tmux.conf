# ─── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi
set -g xterm-keys on
setw -g xterm-keys on

# ─── Prefix stays Ctrl+B ─────────────────────────────────────────────────────

# ─── Splits: S = horizontal divider, V = vertical divider ────────────────────
unbind s
unbind v
unbind '"'
unbind %
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# ─── Windows: Alt + arrows to switch (left/up = prev, right/down = next) ─────
bind -n M-Left  previous-window
bind -n M-Up    previous-window
bind -n M-Right next-window
bind -n M-Down  next-window

# ─── Windows: Alt + number to jump directly ──────────────────────────────────
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

# ─── Panes: Shift + arrows to move focus ─────────────────────────────────────
bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

# Reload config
bind r source-file ~/.tmux.conf \; display-message " carbonfox reloaded "

# ─── Theme: carbonfox (matches nightfox.nvim, transparent like nvim) ─────────
# Carbon palette
%hidden BG="default"
%hidden BG1="#161616"
%hidden BG2="#252525"
%hidden BG3="#353535"
%hidden FG0="#f2f4f8"
%hidden FG2="#b6b8bb"
%hidden FG3="#7b7c7e"
%hidden BLUE="#78a9ff"
%hidden MAGENTA="#be95ff"
%hidden CYAN="#33b1ff"
%hidden PINK="#ff7eb6"
%hidden GREEN="#25be6a"
%hidden YELLOW="#08bdba"
%hidden RED="#ee5396"

# Status bar — transparent, clean, powerline arrows
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=$BG,fg=$FG2"

set -g status-left-length 80
set -g status-right-length 120

set -g status-left "#[fg=$BG1,bg=$BLUE,bold]  #S #[fg=$BLUE,bg=$BG2,nobold]#[fg=$FG0,bg=$BG2,italic] #(whoami) #[fg=$BG2,bg=$BG,nobold,noitalic] "

set -g status-right "#[fg=$BG2,bg=$BG]#[fg=$FG2,bg=$BG2] %a %d %b #[fg=$MAGENTA,bg=$BG2]#[fg=$BG1,bg=$MAGENTA,bold] %H:%M #[fg=$CYAN,bg=$MAGENTA]#[fg=$BG1,bg=$CYAN,bold] #h "

# Windows
setw -g window-status-separator ""
setw -g window-status-format "#[fg=$FG3,bg=$BG,italic]  #I·#W  "
setw -g window-status-current-format "#[fg=$BG,bg=$BLUE]#[fg=$BG1,bg=$BLUE,bold] #I·#W #[fg=$BLUE,bg=$BG,nobold]"

# Panes
set -g pane-border-style "fg=$BG3"
set -g pane-active-border-style "fg=$BLUE"
set -g display-panes-colour "$FG3"
set -g display-panes-active-colour "$BLUE"

# Messages
set -g message-style "bg=$BLUE,fg=$BG1,bold"
set -g message-command-style "bg=$BG2,fg=$FG0"

# Copy-mode highlights
setw -g mode-style "bg=$PINK,fg=$BG1,bold"

# Activity
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=$YELLOW,bg=$BG"

# Bells
set -g visual-bell off
set -g bell-action none

# Clock
setw -g clock-mode-colour "$BLUE"
setw -g clock-mode-style 24
